name: fetch-images
on: push
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
      - run: python3 fetch.py
      - run: |
          git config user.name "images-bot"; git config user.email "bot@users.noreply.github.com"
          git add px && git commit -m "candidates [skip ci]" && git push || true
