name: fetch-images
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p img
          while read id; do
            [ -z "$id" ] && continue
            curl -sL --max-time 60 -o "img/$id.jpg" "https://unsplash.com/photos/$id/download?force=true&w=1800&q=78" || true
          done < ids.txt
          ls -la img
      - name: commit
        run: |
          git config user.name "images-bot"; git config user.email "bot@users.noreply.github.com"
          git add img && git commit -m "images [skip ci]" && git push || true
